<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Organizer Admin | HTC Bolarum</title><style>body{margin:0;background:#f4f0e7;color:#172235;font-family:system-ui}.wrap{max-width:1100px;margin:auto;padding:30px 18px}.head{display:flex;justify-content:space-between;gap:15px;align-items:center}.head h1{font:36px Georgia;color:#102b4c}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:#147b69;color:#fff}.gold{background:#c7a45a}.danger{background:#8d3440;color:#fff}.panel{background:#fff;border:1px solid #e3ddcf;border-radius:18px;padding:22px;margin:18px 0}.events{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.item{border:1px solid #e3ddcf;border-radius:14px;padding:15px}.item h3{margin:0 0 8px;color:#102b4c}.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field input,.field select,.field textarea{padding:11px;border:1px solid #d8d1c3;border-radius:9px;font:inherit}.field textarea{min-height:110px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hint{color:#687385;font-size:13px}.coordrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin:8px 0}@media(max-width:760px){.events,.form{grid-template-columns:1fr}.field.full{grid-column:auto}.coordrow{grid-template-columns:1fr}.head{display:block}}</style></head><body><div class="wrap"><div class="head"><div><h1>Celebration Admin</h1><div class="hint">Manage competition details for the 180th Year Celebration.</div></div><a href="index.html"><button class="btn">View Website</button></a></div><div class="panel"><div class="actions"><button class="btn primary" id="new">+ Add New Event</button><button class="btn gold" id="reset">Restore Initial Events</button></div><p class="hint">This prototype stores changes in this browser. For a shared production admin used by multiple organizers, connect the project to a database before launch.</p></div><div class="panel"><h2>Events</h2><div class="events" id="list"></div></div><div class="panel" id="editor" style="display:none"><h2 id="formTitle">Add Event</h2><form id="form"><div class="form"><div class="field"><label>Event name</label><input id="name" required></div><div class="field"><label>Category</label><select id="category"><option>General</option><option>Sports</option><option>Cultural</option></select></div><div class="field"><label>Date</label><input id="date" type="date"></div><div class="field"><label>Time</label><input id="time" type="text" placeholder="e.g. 10:00 AM – 1:00 PM"></div><div class="field full"><label>Venue</label><input id="venue"></div><div class="field full"><label>Description</label><textarea id="description"></textarea></div><div class="field full"><label>Rules — one rule per line</label><textarea id="rules"></textarea></div><div class="field full"><label>Instructions</label><textarea id="instructions"></textarea></div><div class="field full"><label>Coordinators</label><div id="coords"></div><button type="button" class="btn" id="addCoord">+ Add Coordinator</button></div></div><div class="actions"><button class="btn primary" type="submit">Save Event</button><button class="btn" type="button" id="cancel">Cancel</button><button class="btn danger" type="button" id="delete">Delete Event</button></div></form></div></div><script>const defaults=[{name:'Quiz Competition',category:'General',date:'',time:'',venue:'',description:'',rules:['Event rules to be announced by the committee.'],instructions:'Please check the published event details before attending.',coords:[]},{name:'Singing Competition',category:'Cultural',date:'',time:'',venue:'',description:'',rules:['Event rules to be announced by the committee.'],instructions:'Please check the published event details before attending.',coords:[]},{name:'Volleyball',category:'Sports',date:'',time:'',venue:'',description:'',rules:['Event rules to be announced by the committee.'],instructions:'Please check the published event details before attending.',coords:[]},{name:'Throwball',category:'Sports',date:'',time:'',venue:'',description:'',rules:['Event rules to be announced by the committee.'],instructions:'Please check the published event details before attending.',coords:[]},{name:'Cricket',category:'Sports',date:'',time:'',venue:'',description:'',rules:['Event rules to be announced by the committee.'],instructions:'Please check the published event details before attending.',coords:[]},{name:'Football',category:'Sports',date:'',time:'',venue:'',description:'',rules:['Event rules to be announced by the committee.'],instructions:'Please check the published event details before attending.',coords:[]},{name:'Musical Chairs',category:'Cultural',date:'',time:'',venue:'',description:'',rules:['Event rules to be announced by the committee.'],instructions:'Please check the published event details before attending.',coords:[]}];let events;try{events=JSON.parse(localStorage.getItem('htc_events'))||defaults}catch(e){events=defaults}let editing=-1;function persist(){localStorage.setItem('htc_events',JSON.stringify(events));render()}function render(){document.getElementById('list').innerHTML=events.map((e,i)=>`<div class="item"><h3>${e.name}</h3><div>${e.category||'Event'}</div><div class="hint">${e.date||'Date TBD'} · ${e.venue||'Venue TBD'}</div><div class="actions"><button class="btn" onclick="edit(${i})">Edit</button><a href="event.html?event=${encodeURIComponent(slug(e.name))}"><button type="button" class="btn">View</button></a></div></div>`).join('')}function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')}function fill(e){name.value=e.name;category.value=e.category||'General';date.value=e.date||'';time.value=e.time||'';venue.value=e.venue||'';description.value=e.description||'';rules.value=(e.rules||[]).join('\n');instructions.value=e.instructions||'';coords.innerHTML='';(e.coords||[]).forEach(addCoord)}function addCoord(c={name:'',phone:''}){const r=document.createElement('div');r.className='coordrow';r.innerHTML=`<input placeholder="Coordinator name" value="${c.name||''}"><input placeholder="Phone number" value="${c.phone||''}"><button type="button" class="btn danger">×</button>`;r.querySelector('button').onclick=()=>r.remove();coords.appendChild(r)}function edit(i){editing=i;formTitle.textContent='Edit Event';fill(events[i]);editor.style.display='block';scrollTo({top:editor.offsetTop,behavior:'smooth'})}function openNew(){editing=-1;formTitle.textContent='Add New Event';fill({name:'',category:'General',rules:[],coords:[]});editor.style.display='block'}new.onclick=openNew;addCoord.onclick=()=>addCoord();cancel.onclick=()=>editor.style.display='none';delete.onclick=()=>{if(editing>=0&&confirm('Delete this event?')){events.splice(editing,1);persist();editor.style.display='none'}};reset.onclick=()=>{if(confirm('Restore the seven initial events?')){events=structuredClone(defaults);persist()}};form.onsubmit=e=>{e.preventDefault();const cs=[...coords.children].map(r=>({name:r.children[0].value.trim(),phone:r.children[1].value.trim()})).filter(c=>c.name);const obj={name:name.value.trim(),category:category.value,date:date.value,time:time.value.trim(),venue:venue.value.trim(),description:description.value.trim(),rules:rules.value.split('\n').map(x=>x.trim()).filter(Boolean),instructions:instructions.value.trim(),coords:cs};if(!obj.name)return;if(editing<0)events.push(obj);else events[editing]=obj;persist();editor.style.display='none'};render();</script></body></html>
