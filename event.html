<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Competition Details | HTC Bolarum</title><style>body{margin:0;font-family:system-ui;background:#faf7ef;color:#172235}a{color:#147b69;font-weight:800}.wrap{max-width:900px;margin:auto;padding:25px 18px 70px}.back{display:inline-block;margin:12px 0 28px}.hero{background:#102b4c;color:#fff;border-radius:24px;padding:34px;margin-bottom:20px}.hero h1{font:42px Georgia;margin:10px 0}.badge{display:inline-block;background:#c7a45a;color:#102b4c;padding:5px 10px;border-radius:20px;font-weight:800;font-size:12px;text-transform:uppercase}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.box{background:#fff;border:1px solid #e6e0d3;border-radius:16px;padding:20px}.box h2{font:25px Georgia;color:#102b4c;margin-top:0}.box ul{padding-left:20px}.full{grid-column:1/-1}.meta{display:grid;gap:7px;color:#d9e2ec}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.hero h1{font-size:34px}}</style></head><body><div class="wrap"><a class="back" href="index.html">← Back to competitions</a><div id="app"></div></div><script>const defaults=[{name:'Quiz Competition',category:'General'},{name:'Singing Competition',category:'Cultural'},{name:'Volleyball',category:'Sports'},{name:'Throwball',category:'Sports'},{name:'Cricket',category:'Sports'},{name:'Football',category:'Sports'},{name:'Musical Chairs',category:'Cultural'}];function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')}let all;try{all=JSON.parse(localStorage.getItem('htc_events'))||defaults}catch(e){all=defaults}const key=new URLSearchParams(location.search).get('event');const e=all.find(x=>slug(x.name)===key)||all[0];document.title=e.name+' | 180th Year Celebration';document.getElementById('app').innerHTML=`<section class="hero"><span class="badge">${e.category||'Event'}</span><h1>${e.name}</h1><div class="meta"><div>📅 ${e.date||'Date to be announced'}</div><div>⏰ ${e.time||'Time to be announced'}</div><div>📍 ${e.venue||'Venue to be announced'}</div></div></section><div class="grid"><div class="box full"><h2>About the Event</h2><p>${e.description||'Details for this competition will be published by the 180th Year Celebration committee.'}</p></div><div class="box"><h2>Rules</h2><ul>${(e.rules||[]).map(r=>'<li>'+r+'</li>').join('')}</ul></div><div class="box"><h2>Instructions</h2><p>${e.instructions||'Please follow the instructions of the event coordinators.'}</p></div><div class="box full"><h2>Coordinators</h2>${(e.coords||[]).length?(e.coords||[]).map(c=>`<p><strong>${c.name}</strong>${c.phone?' · <a href="tel:'+c.phone+'">'+c.phone+'</a>':''}</p>`).join(''):'<p>Coordinator details will be published by the committee.</p>'}</div></div>`;</script></body></html>
